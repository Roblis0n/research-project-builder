name: Bug report
description: Report a reproducible problem in a workflow gate, renderer, validator, or documented command.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove private research material, credentials, participant data, and unpublished manuscripts. Link to a minimal public fixture when possible.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: State the problem and the smallest reproduction you can provide.
      placeholder: "Running the Stage 0 validation command returns ..."
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Workflow stage
      description: Select where the problem appears.
      options:
        - Stage 0 — Strategic Decision Gate
        - Stage 1 — live evidence and topic routing
        - Stage 2 — theory, method, or model expansion
        - Validation or shared scripts
        - Documentation or contribution workflow
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      description: Include OS version, shell when relevant, and the output of `python --version`.
      placeholder: "Windows 11, PowerShell 7.4, Python 3.12.4"
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Exact commands and inputs
      description: Paste the commands, redacting only sensitive values. Include the idea or trigger text only if it is safe to share.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "The validator accepts a Stage 0 output and prints Validation passed."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Paste the error, traceback, or a privacy-safe link/screenshot. Remove secrets and identifying research material first.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private datasets, participant information, and unpublished research material.
          required: true
